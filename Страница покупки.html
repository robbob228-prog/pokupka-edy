<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покупка еды в 4 гимназию</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#2563eb);color:#fff;display:grid;place-items:center}.screen{width:min(92%,720px);min-height:420px;display:grid;place-items:center;text-align:center}.card{width:100%;padding:48px 28px;border-radius:24px;background:rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.25);backdrop-filter:blur(10px)}h1{font-size:clamp(30px,6vw,54px);margin:0 0 28px}.buy,.option{border:0;border-radius:14px;padding:16px 30px;font-size:20px;font-weight:700;cursor:pointer;transition:.2s}.buy{background:#facc15;color:#111827}.buy:hover,.option:hover{transform:translateY(-2px);filter:brightness(1.08)}.hidden{display:none}.option{background:#fff;color:#1d4ed8;margin-top:16px;width:min(100%,320px)}.price{margin:12px 0 4px;font-size:18px;font-weight:700;color:#fef3c7}.payment-options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.back{display:block;margin:24px auto 0;background:transparent;color:#dbeafe;border:1px solid #bfdbfe;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer}.back:hover{background:rgba(255,255,255,.12)}</style>
</head>
<body>
<main class="screen">
<section id="home" class="card">
<h1>Готовы к покупке?</h1>
<button class="buy" id="buyButton">Купить</button>
</section>
<section id="purchase" class="card hidden">
<h1>Что вы хотите купить?</h1>
<button class="option product-button" id="chiorioButton" data-product="Чио Рио" data-price="50">Чио Рио</button>
<p class="price">Стоимость: 50 рублей</p>
<button class="option product-button" id="crocantButton" data-product="Крокант" data-price="40">Крокант</button>
<p class="price">Стоимость: 40 рублей</p>
<button class="option product-button" id="stepButton" data-product="Степ" data-price="55">Степ</button>
<p class="price">Стоимость: 55 рублей</p>
<button class="back" id="backButton">Вернуться назад</button>
</section>
<section id="payment" class="card hidden">
<h1>Выберите способ оплаты</h1>
<p id="selectedProduct" class="price"></p>
<div class="payment-options">
<button class="option" id="sbpButton">Оплата через СБП</button>
<button class="option" id="cardButton">Оплата картой</button>
</div>
<button class="back" id="paymentBackButton">Вернуться назад</button>
</section>
</main>
<script>
const home=document.getElementById('home'),purchase=document.getElementById('purchase'),payment=document.getElementById('payment');
document.getElementById('buyButton').onclick=()=>{home.classList.add('hidden');purchase.classList.remove('hidden');history.pushState({page:'purchase'},'', '#purchase')};
document.getElementById('backButton').onclick=()=>{purchase.classList.add('hidden');home.classList.remove('hidden');history.pushState({},'',location.pathname)};
document.querySelectorAll('.product-button').forEach(button=>{button.onclick=()=>{document.getElementById('selectedProduct').textContent=`${button.dataset.product} — ${button.dataset.price} рублей`;purchase.classList.add('hidden');payment.classList.remove('hidden');history.pushState({page:'payment'},'', '#payment')}});
document.getElementById('paymentBackButton').onclick=()=>{payment.classList.add('hidden');purchase.classList.remove('hidden');history.pushState({page:'purchase'},'', '#purchase')};
document.getElementById('sbpButton').onclick=()=>alert('Вы выбрали оплату через СБП');
document.getElementById('cardButton').onclick=()=>alert('Вы выбрали оплату картой');
window.onpopstate=()=>{payment.classList.add('hidden');purchase.classList.add('hidden');if(location.hash==='#payment'){payment.classList.remove('hidden')}else if(location.hash==='#purchase'){purchase.classList.remove('hidden')}else{home.classList.remove('hidden')}};
</script>
</body>
</html>
